# Local-only services. Production uses a managed PostgreSQL and a managed Redis.
# `version` is omitted — Compose v2 ignores it and warns when it is present.

services:
  postgres:
    image: postgres:16-alpine
    container_name: knazawy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knazawy
      POSTGRES_PASSWORD: knazawy
      POSTGRES_DB: knazawy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: knazawy-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']

volumes:
  postgres_data:
  redis_data:
